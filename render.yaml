services:
  - type: web
    name: aicte-fdr-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.bootstrap && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: demo
      - key: DATABASE_URL
        fromDatabase:
          name: aicte-fdr-demo
          property: connectionString
      - key: MOCK_BANK_SERVICE_URL
        fromService:
          type: web
          name: aicte-fdr-mock-bank
          property: host
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_DIR
        value: ./storage_private
      - key: FROZEN_DEMO_CLOCK
        value: 2026-10-26T04:30:00Z
      - key: DISPLAY_TIMEZONE
        value: Asia/Kolkata
      - fromGroup: aicte-demo-secrets

  - type: web
    name: aicte-fdr-mock-bank
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m mock_bank.seed_bank && uvicorn mock_bank.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MOCK_BANK_DB_URL
        fromDatabase:
          name: aicte-fdr-demo
          property: connectionString
      - fromGroup: aicte-demo-secrets

  - type: web
    name: aicte-fdr-portal
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://aicte-fdr-api-oaml.onrender.com

envVarGroups:
  - name: aicte-demo-secrets
    envVars:
      - key: BANK_SERVICE_TOKEN
        generateValue: true

databases:
  - name: aicte-fdr-demo
    plan: free
    databaseName: aicte_fdr_demo
    user: aicte_fdr_demo
